name: Build and deploy

# On every push to main:
#  1. Cloudflare Pages project "jomerjorge" -> https://jomerjorge.com and https://jomerjorge.pages.dev
#     (needs repository secret CLOUDFLARE_API_TOKEN; CLOUDFLARE_ACCOUNT_ID is optional
#      when the token can only see one account)
#  2. GitHub Pages backup copy -> https://jjorge1999.github.io/portfolio/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NG_CLI_ANALYTICS: 'false'
    steps:
      - name: Check Cloudflare token
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN secret (Settings > Secrets and variables > Actions) to deploy to jomerjorge.com."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with: { node-version: 22 }
      - if: steps.check.outputs.ok == 'true'
        run: npm ci
      - name: Build for jomerjorge.com
        if: steps.check.outputs.ok == 'true'
        run: npx ng build --base-href /
      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages deploy dist/portfolio/browser --project-name=jomerjorge --branch=main --commit-dirty=true

  github-pages:
    runs-on: ubuntu-latest
    env: { NG_CLI_ANALYTICS: 'false' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Build
        run: npx ng build --base-href /${{ github.event.repository.name }}/
      - name: Publish to the gh-pages branch
        working-directory: dist/portfolio/browser
        run: |
          # This copy is a mirror; only https://jomerjorge.com should be indexed.
          sed -i 's|<meta name="robots" content="[^"]*">|<meta name="robots" content="noindex">|' index.html
          grep -q 'content="noindex"' index.html
          cp index.html 404.html
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
