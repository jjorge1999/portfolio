<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found | Jomer Jorge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <style>
    :root { color-scheme: light dark; --bg: light-dark(#f5f7fb, #090d16); --text: light-dark(#0b1220, #f8fafc); --muted: light-dark(#475569, #94a3b8); --accent: #2563eb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font: 400 16px/1.6 system-ui, 'Segoe UI', sans-serif; text-align: center; }
    .code { font: 500 12px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 8px 0 12px; font-size: clamp(1.8rem, 5vw, 2.4rem); letter-spacing: -0.02em; }
    p { margin: 0 0 24px; color: var(--muted); }
    a { display: inline-block; padding: 12px 20px; border-radius: 6px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <div class="code">404 · Page not found</div>
    <h1>This page doesn't exist.</h1>
    <p>The link may be old or mistyped.</p>
    <a href="/">Go to jomerjorge.com</a>
  </main>
</body>
</html>
